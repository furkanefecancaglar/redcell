name = "redcell"
main = "worker.js"
compatibility_date = "2024-11-01"

# Serve the real 0-dependency source files as text (GET /src/<file>.py) so devs can
# curl exactly what the /mcp, /ci, and /quickstart pages tell them to vendor.
[[rules]]
type = "Text"
globs = ["**/*.py"]
# Deploy on Cloudflare's FREE plan (no card). See CLOUDFLARE_WORKER.md.
# wrangler bundles worker.js + redcell.js + redcell_scanner.js automatically.

# Breach data moat — every jailbreak attempt is logged (free KV, no card).
[[kv_namespaces]]
binding = "BREACH_LOG"
id = "0180c20eac4c44d19122e73caf98f535"

# Lead capture — waitlist / demo requests (free KV, no card).
[[kv_namespaces]]
binding = "LEADS"
id = "a0e2b7025ec040c99db46206c793ecac"
