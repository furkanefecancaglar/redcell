# REDCELL's own regression tests (0 API — never calls the live engine).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # node is needed so the Python<->JS parity test actually runs (it skips without it)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # root deps + dev deps + backend API deps (tests/test_backend_api.py imports FastAPI app)
      - run: pip install -r requirements.txt -r requirements-dev.txt -r services/api/requirements.txt
      - run: python -m pytest -q
